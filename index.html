<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Djurkliniken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
<div id="app">

  <!-- Startskärm -->
  <section id="screen-start" class="screen active">
    <div class="start-logo" id="start-logo"></div>
    <h1 class="start-title">Djurkliniken</h1>
    <p class="start-sub">Ta hand om djur och hjälp dem när de har skadat sig!</p>
    <div class="parade" id="parade"></div>
    <div class="start-buttons">
      <button class="btn big green hidden" id="btn-continue">Fortsätt spela</button>
      <button class="btn big" id="btn-new">Nytt spel</button>
    </div>
  </section>

  <!-- Skaffa djur -->
  <section id="screen-adopt" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="home" aria-label="Tillbaka"></button>
      <h2>Skaffa ett nytt djur</h2>
      <span class="pill"><span class="pill-ico" data-icon="coin"></span><b class="coin-count">0</b></span>
    </header>
    <div class="adopt-body">
      <p class="adopt-hint" id="adopt-hint">Vilket djur vill du ha?</p>
      <div class="species-grid" id="species-grid"></div>
      <div class="adopt-panel hidden" id="adopt-panel">
        <div class="adopt-preview" id="adopt-preview"></div>
        <p class="label">Välj färg</p>
        <div class="swatches" id="swatches"></div>
        <p class="label">Vad ska djuret heta?</p>
        <div class="name-row">
          <input id="name-input" maxlength="14" placeholder="Skriv ett namn..." autocomplete="off">
          <button class="icon-btn" id="random-name" aria-label="Slumpa namn" title="Slumpa ett namn"></button>
        </div>
        <button class="btn big green" id="adopt-btn">Adoptera!</button>
      </div>
    </div>
  </section>

  <!-- Gården -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <div class="logo"><span id="home-logo"></span><span>Djurkliniken</span></div>
      <span class="pill"><span class="pill-ico" data-icon="star"></span><b id="star-count">0</b></span>
      <span class="pill"><span class="pill-ico" data-icon="coin"></span><b class="coin-count">0</b></span>
      <div class="top-actions">
        <button class="btn blue" data-go="adopt"><span class="btn-ico" data-icon="plus"></span><span>Djur</span></button>
        <button class="btn" data-go="shop"><span class="btn-ico" data-icon="bag"></span><span>Butik</span></button>
        <button class="icon-btn" id="btn-theme" aria-label="Välj miljö" title="Välj miljö"></button>
        <button class="icon-btn" id="btn-sound" aria-label="Ljud av/på"></button>
      </div>
    </header>
    <div class="garden" id="garden">
      <div class="bg-layer" id="garden-bg"></div>
      <div class="weather" id="garden-weather"></div>
      <div id="garden-graves"></div>
      <div id="garden-animals"></div>
      <button class="wild-door hidden" id="wild-door"></button>
      <div class="empty-hint hidden" id="empty-hint">
        <p>Välkommen till din djurklinik! Du har inga egna djur än.</p>
        <button class="btn blue" data-go="adopt">Skaffa ditt första djur</button>
      </div>
      <div id="debug-panel" class="hidden"></div>
    </div>
  </section>

  <!-- Behandlingsrummet -->
  <section id="screen-treat" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="treat-back" aria-label="Tillbaka"></button>
      <h2 id="treat-title">Behandlingsrummet</h2>
      <span class="pill"><span class="pill-ico" data-icon="coin"></span><b class="coin-count">0</b></span>
    </header>
    <div class="treat-main">
      <div class="treat-stage" id="treat-stage">
        <div class="bg-layer" id="clinic-bg"></div>
        <div class="stage-inner">
          <div class="treat-animal" id="treat-animal"></div>
          <div id="table-holder"></div>
        </div>
        <div class="target-ring hidden" id="target-ring"></div>
        <div id="fx-layer"></div>
      </div>
      <div class="treat-panel">
        <div class="vet-row">
          <div class="vet-face" id="vet-face"></div>
          <div class="speech">
            <p id="treat-problem"></p>
            <p id="treat-msg"></p>
          </div>
        </div>
        <div class="progress hidden" id="action-progress"><i></i></div>
        <div class="steps" id="treat-steps"></div>
      </div>
    </div>
    <div class="toolbar" id="toolbar"></div>
  </section>

  <!-- Apport -->
  <section id="screen-play" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="play-back" aria-label="Tillbaka"></button>
      <h2 id="play-title">Apport</h2>
      <span class="pill"><span class="pill-ico" data-icon="ball"></span><b id="play-count">0 / 5</b></span>
      <span class="pill"><span class="pill-ico" data-icon="coin"></span><b class="coin-count">0</b></span>
    </header>
    <div class="play-field" id="play-field">
      <div class="bg-layer" id="play-bg"></div>
      <div class="weather" id="play-weather"></div>
      <div class="play-hint" id="play-hint"></div>
      <div class="play-goal" id="play-goal"></div>
      <div class="play-shadow" id="play-shadow"></div>
      <div class="pet play-pet" id="play-pet"><div class="says hidden" id="play-says"></div><div class="pet-svg"></div></div>
      <div class="play-ball" id="play-ball"></div>
    </div>
  </section>

  <!-- Promenad / ridtur -->
  <section id="screen-walk" class="screen">
    <header class="topbar">
      <button class="icon-btn" id="walk-back" aria-label="Tillbaka"></button>
      <h2 id="walk-title">Promenad</h2>
      <span class="pill"><span class="pill-ico" data-icon="coin"></span><b id="walk-coins">0</b></span>
    </header>
    <div class="walk-progress" id="walk-progress"><i></i></div>
    <div class="walk-field" id="walk-field">
      <div class="walk-layer" id="walk-hills"></div>
      <div class="walk-layer" id="walk-trees"></div>
      <div class="walk-ground" id="walk-ground"></div>
      <div id="walk-objs"></div>
      <div class="weather" id="walk-weather"></div>
      <div class="walk-pet" id="walk-pet"></div>
      <div class="play-hint" id="walk-hint"></div>
    </div>
  </section>

  <!-- Butik -->
  <section id="screen-shop" class="screen">
    <header class="topbar">
      <button class="icon-btn" data-go="home" aria-label="Tillbaka"></button>
      <h2>Butiken</h2>
      <span class="pill"><span class="pill-ico" data-icon="coin"></span><b class="coin-count">0</b></span>
    </header>
    <div class="shop-tabs" id="shop-tabs">
      <button data-tab="mat" class="active">Mat</button>
      <button data-tab="tillbehor">Tillbehör</button>
      <button data-tab="plats">Fler platser</button>
    </div>
    <div class="shop-grid" id="shop-grid"></div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
<div id="toast-wrap"></div>
<div id="tool-cursor" class="hidden"></div>

<script src="js/sound.js?v=10"></script>
<script src="js/state.js?v=10"></script>
<script src="js/animals.js?v=10"></script>
<script src="js/injuries.js?v=10"></script>
<script src="js/art.js?v=10"></script>
<script src="js/home.js?v=10"></script>
<script src="js/treatment.js?v=10"></script>
<script src="js/shop.js?v=10"></script>
<script src="js/play.js?v=10"></script>
<script src="js/walk.js?v=10"></script>
<script src="js/main.js?v=10"></script>
</body>
</html>
